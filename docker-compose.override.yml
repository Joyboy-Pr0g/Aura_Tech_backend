# Local development overrides — auto-loaded by Docker Compose
# Usage: docker compose up --build
# Exposes Postgres/Redis for local tools (pgAdmin, Redis Insight)

services:
  postgres:
    ports:
      - '5432:5432'

  redis:
    ports:
      - '6379:6379'

  backend:
    build:
      context: .
      target: builder
    command: npm run dev
    volumes:
      - ./src:/app/src
      - ./nodemon.json:/app/nodemon.json:ro
      - ./tsconfig.json:/app/tsconfig.json:ro
    environment:
      NODE_ENV: development
      PORT: 5000
      API_URL: http://localhost:3000
      CORS_ORIGIN: http://localhost:3001
      DB_HOST: postgres
      REDIS_HOST: redis
    ports:
      - '3000:5000'
    mem_limit: 1g
    healthcheck:
      disable: true
