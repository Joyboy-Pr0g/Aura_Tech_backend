# Render Blueprint — Aura Tech backend (free tier)
# Docs: https://render.com/docs/blueprint-spec
#
# After deploy, add these secrets manually in the Render dashboard:
# JWT_SECRET, BREVO_API_KEY, BREVO_FROM_EMAIL, ADMIN_EMAIL,
# CLOUDINARY_*, FIREBASE_SERVICE_ACCOUNT_JSON (optional)

databases:
  - name: aura-tech-db
    databaseName: aura_tech
    user: aura_tech
    plan: free

services:
  - type: keyvalue
    name: aura-tech-redis
    plan: free
    ipAllowList: []

  - type: web
    name: aura-tech-api
    runtime: docker
    plan: free
    region: frankfurt
    healthCheckPath: /health
    dockerfilePath: ./Dockerfile
    envVars:
      - key: NODE_ENV
        value: production
      - key: API_URL
        value: https://api.auratechplus.com
      - key: CORS_ORIGIN
        value: https://www.auratechplus.com
      - key: DATABASE_URL
        fromDatabase:
          name: aura-tech-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: aura-tech-redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRY
        value: 24h
      - key: VERIFICATION_CODE_EXPIRY
        value: 15
      - key: RESET_CODE_EXPIRY
        value: 30
      - key: CODE_ATTEMPTS
        value: 3
      - key: BCRYPT_ROUNDS
        value: 10
