# AURA TECH — Nginx reverse proxy (optional, host or container)
# Terminates SSL at the edge when Cloudflare is in "Full (strict)" mode
# and you run nginx on the Hetzner host with origin certificates.
#
# Install on host:
#   sudo apt install nginx
#   sudo cp nginx.conf /etc/nginx/sites-available/auratech-api
#   sudo ln -s /etc/nginx/sites-available/auratech-api /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Upstream points to Docker-published backend port on localhost.

upstream auratech_backend {
    server 127.0.0.1:3000;
    keepalive 32;
}

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
limit_conn_zone $binary_remote_addr zone=api_conn:10m;

server {
    listen 80;
    listen [::]:80;
    server_name api.auratechplus.com;

    # Redirect HTTP → HTTPS (when TLS certs are configured)
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.auratechplus.com;

    # Replace with your Cloudflare Origin Certificate or Let's Encrypt paths
    ssl_certificate     /etc/ssl/auratech/origin.pem;
    ssl_certificate_key /etc/ssl/auratech/origin.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Security headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    client_max_body_size 12m;

    # Rate limiting
    limit_req zone=api_limit burst=60 nodelay;
    limit_conn api_conn 40;

    location /health {
        proxy_pass http://auratech_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        access_log off;
    }

    location / {
        proxy_pass http://auratech_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
